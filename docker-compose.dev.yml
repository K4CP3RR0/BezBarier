services:
  postgres-dev:
    image: postgis/postgis:16-3.4
    container_name: bezbarier_local_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: bezbarier_dev
    ports:
      - "5432:5432"
    volumes:
      - local_postgis_data:/var/lib/postgresql/data

volumes:
  local_postgis_data:
